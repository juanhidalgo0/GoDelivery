<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mandado: bolsa de papel kraft con el círculo GO!. Exportar con node illus/export.mjs go-bag -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2bd88"/>
      <stop offset="1" stop-color="#cfa36b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98c55"/>
      <stop offset="1" stop-color="#a87c47"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <ellipse cx="256" cy="452" rx="170" ry="24" fill="#000" opacity="0.2" filter="url(#shadow)"/>

  <!-- asa de atrás -->
  <path d="M214 162 C214 70 322 70 322 162" fill="none" stroke="#8f6636" stroke-width="11" stroke-linecap="round"/>
  <!-- costado -->
  <path d="M356 160 L396 170 L404 440 L364 448 Z" fill="url(#side)" stroke="#8f6636" stroke-width="4" stroke-linejoin="round"/>
  <path d="M376 166 L384 444" stroke="#8f6636" stroke-width="3" opacity="0.5"/>
  <!-- frente -->
  <path d="M112 160 L356 160 L364 448 L100 448 Z" fill="url(#face)" stroke="#8f6636" stroke-width="4" stroke-linejoin="round"/>
  <path d="M112 160 L356 160 L357 186 L111 186 Z" fill="#c9995d" opacity="0.55"/>
  <!-- asa de adelante -->
  <path d="M176 176 C176 80 292 80 292 176" fill="none" stroke="#a87c47" stroke-width="12" stroke-linecap="round"/>
  <circle cx="176" cy="178" r="7" fill="#8f6636"/><circle cx="292" cy="178" r="7" fill="#8f6636"/>

  <!-- GO! -->
  <circle cx="234" cy="318" r="78" fill="#0b0b0c"/>
  <text x="234" y="342" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="66" letter-spacing="-2" fill="#f7f5f1">GO!</text>
  <circle cx="234" cy="240" r="9" fill="#e11d48"/>
</svg>
