<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Go Cash: pila de billetes genéricos (sin moneda real) con la faja GO!. Exportar con node illus/export.mjs -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3efd9"/>
      <stop offset="1" stop-color="#c6dcb8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5cfa5"/>
      <stop offset="1" stop-color="#8fb27d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1b1e"/>
      <stop offset="0.5" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#1b1b1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="topBill"><rect x="0" y="0" width="360" height="176" rx="18"/></clipPath>
  </defs>

  <ellipse cx="258" cy="392" rx="190" ry="26" fill="#000" opacity="0.2" filter="url(#shadow)"/>

  <g transform="translate(256 262) rotate(-9) translate(-180 -88)">
    <!-- canto de la pila -->
    <path d="M0 110 v52 a18 18 0 0 0 18 18 h324 a18 18 0 0 0 18 -18 v-52 z" fill="url(#edge)"/>
    <g stroke="#7ea26c" stroke-width="3" opacity="0.7">
      <line x1="10" y1="122" x2="350" y2="122"/><line x1="10" y1="134" x2="350" y2="134"/>
      <line x1="10" y1="146" x2="350" y2="146"/><line x1="10" y1="158" x2="350" y2="158"/>
      <line x1="12" y1="170" x2="348" y2="170"/>
    </g>
    <!-- billete de arriba -->
    <g transform="translate(0 -60)">
      <rect x="0" y="0" width="360" height="176" rx="18" fill="url(#face)" stroke="#6f955f" stroke-width="4"/>
      <g clip-path="url(#topBill)">
        <rect x="16" y="16" width="328" height="144" rx="10" fill="none" stroke="#7ea26c" stroke-width="3" opacity="0.8"/>
        <circle cx="72" cy="88" r="40" fill="none" stroke="#7ea26c" stroke-width="3" opacity="0.8"/>
        <text x="72" y="104" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="46" fill="#4f7a41">$</text>
        <rect x="236" y="54" width="84" height="12" rx="6" fill="#9dbd8c"/>
        <rect x="256" y="76" width="64" height="12" rx="6" fill="#9dbd8c"/>
        <rect x="236" y="112" width="84" height="12" rx="6" fill="#9dbd8c"/>
      </g>
    </g>
    <!-- faja GO! -->
    <g>
      <rect x="138" y="-66" width="92" height="248" rx="10" fill="url(#band)"/>
      <circle cx="184" cy="56" r="36" fill="#0b0b0c" stroke="#f7f5f1" stroke-width="4"/>
      <text x="184" y="68" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="32" letter-spacing="-1" fill="#f7f5f1">GO!</text>
      <circle cx="184" cy="17" r="6" fill="#e11d48"/>
    </g>
  </g>
</svg>
