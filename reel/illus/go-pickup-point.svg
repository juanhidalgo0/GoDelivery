<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Encomienda: caja de cartón con cinta GO! y el pin de destino. Exportar con node illus/export.mjs go-pickup-point -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c595"/><stop offset="1" stop-color="#d7ad74"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2a468"/><stop offset="1" stop-color="#c29156"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b88a50"/><stop offset="1" stop-color="#a77a43"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <ellipse cx="240" cy="444" rx="196" ry="26" fill="#000" opacity="0.2" filter="url(#shadow)"/>

  <!-- caja -->
  <g stroke="#8f6636" stroke-width="4" stroke-linejoin="round">
    <path d="M60 214 L200 160 L340 214 L200 268 Z" fill="url(#top)"/>
    <path d="M60 214 L200 268 L200 440 L60 386 Z" fill="url(#left)"/>
    <path d="M200 268 L340 214 L340 386 L200 440 Z" fill="url(#right)"/>
  </g>
  <!-- cinta GO! -->
  <path d="M112 194 L252 248 L252 420 L226 430 L226 258 L86 204 Z" fill="#0b0b0c"/>
  <path d="M112 194 L252 248 L278 238 L138 184 Z" fill="#1b1b1e"/>
  <g transform="translate(239 330) rotate(-90)">
    <text x="0" y="6" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="20" letter-spacing="1" fill="#f7f5f1">GO!</text>
  </g>
  <!-- etiqueta -->
  <path d="M96 300 L168 328 L168 372 L96 344 Z" fill="#fbfaf8" stroke="#8f6636" stroke-width="3" stroke-linejoin="round"/>
  <path d="M108 318 L154 336" stroke="#c9b9a3" stroke-width="5" stroke-linecap="round"/>
  <path d="M108 332 L140 344" stroke="#c9b9a3" stroke-width="5" stroke-linecap="round"/>

  <!-- pin de destino -->
  <g transform="translate(372 96)">
    <ellipse cx="0" cy="318" rx="34" ry="9" fill="#000" opacity="0.18"/>
    <path d="M0 316 C-18 280 -78 214 -78 150 A78 78 0 0 1 78 150 C78 214 18 280 0 316 Z" fill="url(#pin)" stroke="#9f1239" stroke-width="4"/>
    <circle cx="0" cy="150" r="42" fill="#fff"/>
    <circle cx="0" cy="150" r="17" fill="#0b0b0c"/>
  </g>
</svg>
