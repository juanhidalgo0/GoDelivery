<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vista previa · panel del repartidor (desarrollo)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/index.css" />
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0C0F13; overflow: hidden; }
    #driver-fullscreen-map { position: fixed; inset: 0; }
    #driver-top-status-bar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 50; display: flex; flex-direction: column; pointer-events: none; }
    #driver-top-status-bar > * { pointer-events: auto; }
    #driver-footer-dock-container { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 60; }
    #preview-cases { position: fixed; z-index: 1000000; top: 42%; right: 8px; opacity: .85; }
    #preview-cases select { height: 34px; border-radius: 10px; border: 1px solid #333; background: #111; color: #eee; font: 600 12px Inter, sans-serif; padding: 0 8px; }
  </style>
</head>
<body>
  <div id="driver-fullscreen-map"></div>
  <div id="driver-top-status-bar"></div>
  <div id="driver-footer-dock-container"></div>
  <div id="modal-container"></div>
  <div id="preview-cases">
    <select id="preview-case-select" aria-label="Caso a mostrar"></select>
  </div>
  <script type="module" src="/src/dev/driver-preview.js"></script>
</body>
</html>
