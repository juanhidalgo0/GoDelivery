<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title id="pageTitle">Tienda Online — Ventra</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --brand:#0E6E52; --brand-ink:#0f172a; --bg:#FAF8F5; --surface:#FFFFFF;
    --border:#ECE5DB; --ink:#1D1710; --ink-2:#6E6459;
    --shadow-md:0 10px 32px -12px rgba(29,23,16,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  img{max-width:100%;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- Loading / Error states ---- */
  .full-center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
  .spinner{width:40px;height:40px;border-radius:50%;border:4px solid #eee;border-top-color:var(--brand);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Header ---- */
  header.store-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .header-inner{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--brand);flex-shrink:0;}
  .store-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;margin:0;line-height:1.1;}
  .store-sub{font-size:11px;color:var(--ink-2);margin:2px 0 0;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .cart-btn{margin-left:auto;position:relative;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .cart-badge{position:absolute;top:-6px;right:-6px;background:var(--brand-ink);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:800;}

  /* ---- Banner ---- */
  .banner{width:100%;aspect-ratio:3/1;object-fit:cover;display:block;background:#eee;}

  /* ---- Categories / products ---- */
  main{max-width:960px;margin:0 auto;padding:20px 16px 100px;width:100%;flex:1;}
  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
  .cat-tab{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-2);white-space:nowrap;}
  .cat-tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .product-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md);}
  .product-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f1ede6;}
  .product-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .product-name{font-size:12.5px;font-weight:700;line-height:1.25;margin:0;min-height:32px;}
  .product-price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;color:var(--brand);margin:0;}
  .out-of-stock{font-size:10px;font-weight:800;color:#b91c1c;text-transform:uppercase;}
  .add-btn{margin-top:auto;background:var(--brand-ink);color:#fff;border:none;border-radius:10px;padding:8px;font-weight:700;font-size:12px;cursor:pointer;}
  .add-btn:disabled{background:#cbd5e1;cursor:not-allowed;}
  .qty-row{display:flex;align-items:center;gap:8px;justify-content:center;}
  .qty-row button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:800;cursor:pointer;}
  .qty-row span{font-weight:800;font-size:13px;min-width:16px;text-align:center;}

  /* ---- Cart drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:40;display:none;}
  .overlay.open{display:block;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:var(--surface);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.25s ease;box-shadow:-8px 0 24px rgba(0,0,0,0.12);}
  .drawer.open{transform:translateX(0);}
  .drawer-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .drawer-header h3{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;}
  .drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-2);}
  .drawer-body{flex:1;overflow-y:auto;padding:12px 16px;}
  .cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .cart-item img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#f1ede6;flex-shrink:0;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{font-size:12.5px;font-weight:700;margin:0 0 4px;}
  .cart-item-price{font-size:12px;color:var(--ink-2);margin:0;}
  .remove-link{font-size:10.5px;color:#b91c1c;font-weight:700;background:none;border:none;cursor:pointer;padding:0;margin-top:4px;}
  .drawer-footer{border-top:1px solid var(--border);padding:16px;}
  .total-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:12px;}
  .btn-primary{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .empty-cart{text-align:center;color:var(--ink-2);font-size:13px;padding:40px 0;}

  /* ---- Checkout form ---- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-2);margin-bottom:5px;}
  .field input, .field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;}
  .field textarea{resize:vertical;min-height:60px;}
  .back-link{background:none;border:none;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px;}

  footer.store-footer{border-top:1px solid var(--border);padding:20px 16px;text-align:center;font-size:11px;color:var(--ink-2);}

  @media (prefers-color-scheme: dark){
    :root{ --bg:#15130f; --surface:#211d18; --border:#332c22; --ink:#f5f1ea; --ink-2:#a89e8f; }
    .banner{background:#332c22;}
    .product-img{background:#2a251d;}
    .qty-row button{background:#2a251d;color:#f5f1ea;}
    .field input, .field textarea{background:#2a251d;color:#f5f1ea;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="full-center" id="loadingState">
    <div class="spinner"></div>
    <p style="font-weight:700;color:var(--ink-2);font-size:13px;">Cargando tienda...</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAldeFtUWWlEpcuEg1LSTko90cVEvnsMLA",
  authDomain: "godelivery-magdalena.firebaseapp.com",
  projectId: "godelivery-magdalena",
  storageBucket: "godelivery-magdalena.firebasestorage.app",
  messagingSenderId: "848164656125",
  appId: "1:848164656125:web:eef2314205f5d8f887ff94"
});
var db = firebase.firestore();

var RUBRO_CATEGORIES_HINT = {
  KIOSKO: 'Almacén',
  FERRETERIA: 'Ferretería',
  INDUMENTARIA: 'Indumentaria',
  OTRO: 'Productos'
};

function money(n) {
  return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0 }).format(n || 0);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

var state = {
  storeId: null,
  config: null,
  products: [],
  activeCategory: 'ALL',
  cart: {}, // productId -> { product, qty }
  cartOpen: false,
  checkoutOpen: false
};

function slugFromPath() {
  var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
  return decodeURIComponent(path || '');
}

function cartKey(storeId) { return 'ventra_cart_' + storeId; }

function loadCartFromStorage(storeId) {
  try {
    var raw = localStorage.getItem(cartKey(storeId));
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveCartToStorage() {
  try { localStorage.setItem(cartKey(state.storeId), JSON.stringify(state.cart)); } catch (e) {}
}

function cartCount() {
  return Object.values(state.cart).reduce(function (sum, item) { return sum + item.qty; }, 0);
}
function cartTotal() {
  return Object.values(state.cart).reduce(function (sum, item) { return sum + item.qty * item.product.price; }, 0);
}

async function init() {
  var slug = slugFromPath();
  if (!slug) {
    renderNotFound('Esta es la plataforma de tiendas online de Ventra. Para ver una tienda, ingresá con el enlace que te compartió el comercio.');
    return;
  }

  try {
    var snap = await db.collection('ventra_stores').where('subdomain', '==', slug).limit(1).get();
    if (snap.empty) {
      renderNotFound('No encontramos ninguna tienda con esa dirección.');
      return;
    }
    var doc = snap.docs[0];
    var config = doc.data();
    if (!config.isPublished) {
      renderNotFound('Esta tienda todavía no fue publicada por su dueño.');
      return;
    }
    state.storeId = doc.id;
    state.config = config;
    state.cart = loadCartFromStorage(doc.id);

    document.getElementById('pageTitle').textContent = config.businessName + ' — Tienda Online';
    document.documentElement.style.setProperty('--brand', config.primaryColor || '#0E6E52');
    document.documentElement.style.setProperty('--brand-ink', config.secondaryColor || '#0f172a');

    var productsSnap = await db.collection('ventra_stores').doc(doc.id).collection('products').get();
    state.products = productsSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

    renderStore();
  } catch (err) {
    console.error(err);
    renderNotFound('Ocurrió un error al cargar la tienda. Intentá de nuevo en unos minutos.');
  }
}

function renderNotFound(message) {
  document.getElementById('app').innerHTML =
    '<div class="full-center">' +
      '<h2 style="font-family:\'Bricolage Grotesque\',sans-serif;margin:0;">Tienda no disponible</h2>' +
      '<p style="color:var(--ink-2);max-width:360px;font-size:13px;">' + esc(message) + '</p>' +
    '</div>';
}

function categories() {
  var set = {};
  state.products.forEach(function (p) { set[p.category || 'Varios'] = true; });
  return Object.keys(set);
}

function renderStore() {
  var cfg = state.config;
  var cats = categories();

  var html = '';
  html += '<header class="store-header"><div class="header-inner">';
  html += cfg.logoUrl ? '<img class="logo" src="' + cfg.logoUrl + '" alt="Logo">' : '<div class="logo"></div>';
  html += '<div><p class="store-name">' + esc(cfg.businessName) + '</p><p class="store-sub">' + esc(RUBRO_CATEGORIES_HINT[cfg.rubro] || 'Tienda Online') + '</p></div>';
  html += '<button class="cart-btn" id="openCartBtn">🛒 Carrito<span class="cart-badge" id="cartBadge" style="display:' + (cartCount() > 0 ? 'flex' : 'none') + '">' + cartCount() + '</span></button>';
  html += '</div></header>';

  if (cfg.bannerUrl) {
    html += '<img class="banner" src="' + cfg.bannerUrl + '" alt="Banner">';
  }

  html += '<main>';
  if (cats.length > 1) {
    html += '<div class="cat-tabs">';
    html += '<button class="cat-tab' + (state.activeCategory === 'ALL' ? ' active' : '') + '" data-cat="ALL">Todos</button>';
    cats.forEach(function (c) {
      html += '<button class="cat-tab' + (state.activeCategory === c ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    html += '</div>';
  }

  var visibleProducts = state.products.filter(function (p) {
    return state.activeCategory === 'ALL' || (p.category || 'Varios') === state.activeCategory;
  });

  if (visibleProducts.length === 0) {
    html += '<p style="text-align:center;color:var(--ink-2);padding:40px 0;">Todavía no hay productos cargados en esta tienda.</p>';
  } else {
    html += '<div class="product-grid">';
    visibleProducts.forEach(function (p) {
      var qty = state.cart[p.id] ? state.cart[p.id].qty : 0;
      html += '<div class="product-card">';
      html += '<img class="product-img" src="' + (p.imageUrl || '') + '" alt="' + esc(p.name) + '" onerror="this.style.opacity=0">';
      html += '<div class="product-body">';
      html += '<p class="product-name">' + esc(p.name) + '</p>';
      html += '<p class="product-price">' + money(p.price) + '</p>';
      if (!p.inStock) {
        html += '<span class="out-of-stock">Sin Stock</span>';
      } else if (qty > 0) {
        html += '<div class="qty-row"><button data-action="dec" data-id="' + p.id + '">−</button><span>' + qty + '</span><button data-action="inc" data-id="' + p.id + '">+</button></div>';
      } else {
        html += '<button class="add-btn" data-action="add" data-id="' + p.id + '">Agregar</button>';
      }
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</main>';

  html += '<footer class="store-footer">' + esc(cfg.businessName) + (cfg.address ? ' · ' + esc(cfg.address) : '') + (cfg.instagram ? ' · ' + esc(cfg.instagram) : '') + '<br>Tienda creada con Ventra</footer>';

  html += '<div class="overlay" id="overlay"></div>';
  html += '<div class="drawer" id="drawer"></div>';

  document.getElementById('app').innerHTML = html;
  renderDrawer();
  bindEvents();
}

function bindEvents() {
  var openCartBtn = document.getElementById('openCartBtn');
  if (openCartBtn) openCartBtn.addEventListener('click', function () { openCart(); });

  document.querySelectorAll('.cat-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.activeCategory = btn.getAttribute('data-cat');
      renderStore();
    });
  });

  document.querySelectorAll('[data-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-id');
      var action = btn.getAttribute('data-action');
      var product = state.products.find(function (p) { return p.id === id; });
      if (!product) return;
      if (action === 'add' || action === 'inc') {
        var current = state.cart[id] ? state.cart[id].qty : 0;
        state.cart[id] = { product: product, qty: current + 1 };
      } else if (action === 'dec') {
        var cur = state.cart[id] ? state.cart[id].qty : 0;
        if (cur <= 1) delete state.cart[id];
        else state.cart[id].qty = cur - 1;
      }
      saveCartToStorage();
      renderStore();
      if (state.cartOpen) openCart();
    });
  });

  document.getElementById('overlay').addEventListener('click', closeCart);
}

function openCart() {
  state.cartOpen = true;
  state.checkoutOpen = false;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  renderDrawer();
}
function closeCart() {
  state.cartOpen = false;
  state.checkoutOpen = false;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function renderDrawer() {
  var drawer = document.getElementById('drawer');
  if (!drawer) return;

  if (state.checkoutOpen) {
    drawer.innerHTML =
      '<div class="drawer-header"><h3>Tus datos</h3><button class="drawer-close" id="closeDrawerBtn">✕</button></div>' +
      '<div class="drawer-body">' +
        '<button class="back-link" id="backToCartBtn">← Volver al carrito</button>' +
        '<div class="field"><label>Nombre y Apellido *</label><input type="text" id="custName" placeholder="Tu nombre"></div>' +
        '<div class="field"><label>Teléfono *</label><input type="text" id="custPhone" placeholder="11 2345 6789"></div>' +
        '<div class="field"><label>Dirección de entrega / Notas</label><textarea id="custNote" placeholder="Dirección, horario preferido, aclaraciones..."></textarea></div>' +
      '</div>' +
      '<div class="drawer-footer">' +
        '<div class="total-row"><span>Total</span><span>' + money(cartTotal()) + '</span></div>' +
        '<button class="btn-primary" id="sendOrderBtn">Enviar Pedido por WhatsApp</button>' +
      '</div>';
    document.getElementById('closeDrawerBtn').addEventListener('click', closeCart);
    document.getElementById('backToCartBtn').addEventListener('click', function () { state.checkoutOpen = false; renderDrawer(); });
    document.getElementById('sendOrderBtn').addEventListener('click', submitOrder);
    return;
  }

  var items = Object.values(state.cart);
  var body = '';
  if (items.length === 0) {
    body = '<div class="empty-cart">Tu carrito está vacío</div>';
  } else {
    items.forEach(function (item) {
      body += '<div class="cart-item">';
      body += '<img src="' + (item.product.imageUrl || '') + '" onerror="this.style.opacity=0">';
      body += '<div class="cart-item-info">';
      body += '<p class="cart-item-name">' + esc(item.product.name) + '</p>';
      body += '<p class="cart-item-price">' + item.qty + ' x ' + money(item.product.price) + ' = ' + money(item.qty * item.product.price) + '</p>';
      body += '<button class="remove-link" data-remove="' + item.product.id + '">Quitar</button>';
      body += '</div></div>';
    });
  }

  drawer.innerHTML =
    '<div class="drawer-header"><h3>Tu Carrito</h3><button class="drawer-close" id="closeDrawerBtn">✕</button></div>' +
    '<div class="drawer-body">' + body + '</div>' +
    '<div class="drawer-footer">' +
      '<div class="total-row"><span>Total</span><span>' + money(cartTotal()) + '</span></div>' +
      '<button class="btn-primary" id="goCheckoutBtn"' + (items.length === 0 ? ' disabled' : '') + '>Continuar</button>' +
    '</div>';

  document.getElementById('closeDrawerBtn').addEventListener('click', closeCart);
  document.querySelectorAll('[data-remove]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      delete state.cart[btn.getAttribute('data-remove')];
      saveCartToStorage();
      renderStore();
      openCart();
    });
  });
  var goCheckoutBtn = document.getElementById('goCheckoutBtn');
  if (goCheckoutBtn) goCheckoutBtn.addEventListener('click', function () { state.checkoutOpen = true; renderDrawer(); });
}

async function submitOrder() {
  var name = document.getElementById('custName').value.trim();
  var phone = document.getElementById('custPhone').value.trim();
  var note = document.getElementById('custNote').value.trim();

  if (!name || !phone) {
    alert('Por favor completá tu nombre y teléfono.');
    return;
  }

  var items = Object.values(state.cart).map(function (item) {
    return { productId: item.product.id, name: item.product.name, price: item.product.price, qty: item.qty };
  });
  var total = cartTotal();

  var sendBtn = document.getElementById('sendOrderBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Enviando...';

  try {
    await db.collection('ventra_stores').doc(state.storeId).collection('orders').add({
      items: items,
      total: total,
      customerName: name,
      customerPhone: phone,
      customerNote: note,
      status: 'PENDING',
      syncedLocal: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    console.error('No se pudo guardar el pedido en la nube (se envía igual por WhatsApp):', err);
  }

  var lines = [];
  lines.push('🛒 *Nuevo pedido — ' + state.config.businessName + '*');
  lines.push('');
  items.forEach(function (i) { lines.push(i.qty + 'x ' + i.name + ' — ' + money(i.price * i.qty)); });
  lines.push('');
  lines.push('*Total: ' + money(total) + '*');
  lines.push('');
  lines.push('Cliente: ' + name);
  lines.push('Teléfono: ' + phone);
  if (note) lines.push('Notas: ' + note);

  var waNumber = (state.config.whatsappNumber || '').replace(/\D/g, '');
  var waUrl = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(lines.join('\n'));

  state.cart = {};
  saveCartToStorage();
  window.location.href = waUrl;
}

init();
</script>
</body>
</html>
