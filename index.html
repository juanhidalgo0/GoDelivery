<!DOCTYPE html>

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (function() {
      try {
        // 0. Handle direct pathnames (e.g. /tienda/:id or /seguimiento/wa/:id) immediately
        if (window.location.pathname && window.location.pathname !== '/' && !window.location.pathname.endsWith('.html')) {
          var rawPath = window.location.pathname;
          var curHash = window.location.hash || '';
          if (!curHash || curHash === '#/' || curHash === '#' || curHash === '') {
            var targetRoute = rawPath.startsWith('/') ? rawPath : '/' + rawPath;
            window.location.hash = '#' + targetRoute;
            try {
              window.history.replaceState({}, document.title, '/' + window.location.search + window.location.hash);
            } catch(e) {}
          }
        }

        var fullHash = window.location.hash || '';
        if (fullHash.startsWith('#/tienda') || fullHash.includes('direct=true') || fullHash.startsWith('#/seguimiento/wa')) {
          document.documentElement.classList.add('is-direct-store-mode');
        }

        var userStr = localStorage.getItem('gd-user') || localStorage.getItem('gd_user');
        var parsedRole = '';
        if (userStr) {
          try {
            var u = JSON.parse(userStr);
            if (u) parsedRole = u.role || (u.isDelivery ? 'delivery' : '');
          } catch(e) {}
        }
        var isDriverCached = localStorage.getItem('gd_is_delivery') === 'true' || 
                             localStorage.getItem('gd_user_role') === 'delivery' || 
                             localStorage.getItem('gd_user_role') === 'chofer' ||
                             parsedRole === 'delivery' || 
                             parsedRole === 'chofer';
        var isTempClient = sessionStorage.getItem('gd_temp_client_mode') === 'true' || fullHash.startsWith('#/tienda');
        if (isDriverCached && !isTempClient) {
          document.documentElement.classList.add('is-delivery-mode');
          document.documentElement.setAttribute('data-theme', 'dark');
          if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#' || window.location.hash === '') {
            window.location.hash = '#/delivery';
          }
          // GPS Warm-up: Request early location in background so it's ready in 0ms when map opens
          try {
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(function(pos) {
                if (pos && pos.coords) {
                  window.lastRiderPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                }
              }, function() {}, { timeout: 4000, enableHighAccuracy: true });
            }
          } catch(e) {}
        }
      } catch(e) {}
    })();
  </script>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      var s = String(msg || '') + ' ' + String(url || '') + ' ' + (error ? String(error.message || '') : '');
      if (s.indexOf('startTime') !== -1 || s.indexOf('reportAllChanges') !== -1) {
        return true;
      }
      return false;
    };

    var _origConsoleError = console.error;
    console.error = function() {
      var argsStr = Array.prototype.slice.call(arguments).map(function(a) { 
        return String(a && a.message ? a.message : (a || '')); 
      }).join(' ');
      if (argsStr.indexOf('startTime') !== -1 || argsStr.indexOf('reportAllChanges') !== -1) {
        return;
      }
      _origConsoleError.apply(console, arguments);
    };

    window.addEventListener('error', function(e) {
      var msg = (e && e.message) ? e.message : '';
      if (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        return false;
      }
      if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('MIME type') !== -1) {
        if (!sessionStorage.getItem('gd_chunk_reload')) {
          sessionStorage.setItem('gd_chunk_reload', 'true');
          if (window.showUpdateSplashAndReload) {
            window.showUpdateSplashAndReload();
          } else {
            window.location.reload();
          }
        }
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e && e.reason;
      var msg = (reason && reason.message) ? reason.message : String(reason || '');
      if (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1) {
        if (e.preventDefault) e.preventDefault();
        return;
      }
      if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('MIME type') !== -1) {
        if (!sessionStorage.getItem('gd_chunk_reload')) {
          sessionStorage.setItem('gd_chunk_reload', 'true');
          if (window.showUpdateSplashAndReload) {
            window.showUpdateSplashAndReload();
          } else {
            window.location.reload();
          }
        }
      }
    });

    if (window.location.hash.includes('/seguimiento/wa/')) {
      const match = window.location.hash.match(/#\/seguimiento\/wa\/([^?]+)/);
      if (match && match[1]) {
        window.location.href = '/seguimiento.html?id=' + match[1];
      }
    }
  </script>

  <style>
    :root {
      --color-primary: #E11D48;
      --color-secondary: #1A1A1A;
      --color-bg: #FFFFFF;
      --font-display: 'Outfit', sans-serif;
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .skeleton {
      position: relative !important;
      overflow: hidden !important;
    }

    .skeleton::after {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      transform: translateX(-100%) !important;
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 20%,
        rgba(255, 255, 255, 0.6) 60%,
        rgba(255, 255, 255, 0) 100%
      ) !important;
      animation: shimmerSweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
      content: '' !important;
    }

    body {
      margin: 0;
      background: var(--color-bg);
    }

    /* ============================================================
       Splash GO!
       Tinta de fondo (el mismo negro del encabezado). El círculo del logo se
       dibuja como un recorrido y un punto rojo lo va marcando "puerta a
       puerta"; GO! entra hacia adelante, aparece la barrita roja y el lema.
       Al salir, el negro sube como un telón y queda convertido en el header.
       ============================================================ */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0b0c;
      overflow: hidden;
      clip-path: inset(0 0 0 0);
    }

    .gs-stage {
      position: relative;
      width: 184px;
      height: 184px;
    }

    .gs-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .gs-ring circle {
      fill: none;
      stroke: #f7f5f1;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 578.1;
      stroke-dashoffset: 578.1;
      animation: gsDraw 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
    }

    /* The "rider": a red dot riding the head of the stroke */
    .gs-rider {
      position: absolute;
      inset: 0;
      animation: gsOrbit 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.1s both;
    }

    .gs-rider span {
      position: absolute;
      top: 2.4px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: #e11d48;
      box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.22);
      animation: gsArrive 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    /* GO! enters moving forward. The image is drawn a bit larger than its window
       so the anti-aliased edge of the source circle never shows. */
    .gs-logo {
      position: absolute;
      top: 12px;
      left: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      border-radius: 50%;
      overflow: hidden;
      background: #0b0b0c;
      clip-path: inset(0 100% 0 0);
      transform: translateX(-10px);
      animation: gsGo 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }

    .gs-logo img {
      position: absolute;
      top: -1.5%;
      left: -1.5%;
      width: 103%;
      height: 103%;
      object-fit: cover;
      mix-blend-mode: lighten;
    }

    .gs-bar {
      width: 36px;
      height: 4px;
      margin-top: 28px;
      border-radius: 2px;
      background: #e11d48;
      transform: scaleX(0);
      transform-origin: left center;
      animation: gsBar 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.72s forwards;
    }

    .gs-tag {
      margin-top: 14px;
      font: 700 11px/1 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(247, 245, 241, 0.62);
      opacity: 0;
      animation: gsTag 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }

    @keyframes gsDraw { to { stroke-dashoffset: 0; } }
    @keyframes gsOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes gsArrive {
      0%   { transform: scale(1); box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.22); }
      45%  { transform: scale(1.35); box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 4px rgba(225, 29, 72, 0); }
    }
    @keyframes gsGo { to { clip-path: inset(0 0 0 0); transform: translateX(0); } }
    @keyframes gsBar { to { transform: scaleX(1); } }
    @keyframes gsTag { to { opacity: 1; letter-spacing: 0.24em; } }

    /* Exit: content lifts away, then the ink rolls up into the header */
    #splash-screen .gs-stage,
    #splash-screen .gs-bar,
    #splash-screen .gs-tag {
      transition: transform 0.24s cubic-bezier(0.4, 0, 1, 1), opacity 0.2s ease-in;
    }

    #splash-screen.fade-out {
      clip-path: inset(0 0 100% 0);
      transition: clip-path 0.38s cubic-bezier(0.7, 0, 0.2, 1) 0.02s;
      pointer-events: none !important;
    }

    #splash-screen.fade-out .gs-stage,
    #splash-screen.fade-out .gs-bar,
    #splash-screen.fade-out .gs-tag {
      transform: translateY(-28px) scale(0.96);
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .gs-ring circle { animation: none; stroke-dashoffset: 0; }
      .gs-rider, .gs-rider span { animation: none; }
      .gs-logo { animation: none; clip-path: none; transform: none; }
      .gs-bar { animation: none; transform: none; }
      .gs-tag { animation: none; opacity: 1; letter-spacing: 0.24em; }
      #splash-screen.fade-out { clip-path: none; opacity: 0; transition: opacity 0.2s ease; }
    }

    /* Dynamic Loading Text - Premium brand red contrast */
    .loading-text-wrapper {
      position: relative;
      height: 20px;
      width: 280px;
      text-align: center;
      overflow: hidden;
    }

    .loading-text {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0 auto;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: #E11D48;
      opacity: 0;
      transform: translateY(12px);
    }

    .loading-text.text-1 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loading-text.text-2 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 2s;
    }

    .loading-text.text-3 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 4s;
    }

    @keyframes sequenceText {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      5%, 28% {
        opacity: 1;
        transform: translateY(0);
      }
      33%, 100% {
        opacity: 0;
        transform: translateY(-12px);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Smooth App Shell Entry Animation without Layout Shifts */
    #app-header {
      opacity: 0;
      transition: opacity 0.35s ease-out;
      will-change: opacity;
    }

    #app-slider, #app-navbar {
      opacity: 0;
      transform: translateY(12px);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    #app.ready #app-header {
      opacity: 1;
    }

    #app.ready #app-slider {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.08s;
    }

    #app.ready #app-navbar {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.16s;
    }
  </style>

  <script>
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.dataset.dismissed) {
        splash.dataset.dismissed = 'true';
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    }, 2500);
  </script>

      <div>
        <script>
          window.setSplashProgress = function() {};
          // The splash is the way into the app: every open plays the whole GO! intro
          // (~1.4 s) and holds it so "Servicio puerta a puerta" can be read, then the ink rolls
          // up into the header.
          // Timed from when the splash is painted, not from page start, so a slow
          // WebView boot never eats the animation. Reduced motion gets a short hold.
          window.__gsStart = performance.now();
          window.dismissSplashScreen = function(opts) {
            var s = document.getElementById('splash-screen');
            if (!s || s.dataset.dismissed) return;
            s.dataset.dismissed = 'true';
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var minShow = reduce ? 900 : 2700; // the tagline stays readable for over a second
            var elapsed = performance.now() - (window.__gsStart || 0);
            var wait = (opts && opts.immediate) ? 0 : Math.max(0, minShow - elapsed);
            setTimeout(function() {
              s.classList.add('fade-out');
              var appEl = document.getElementById('app');
              if (appEl) appEl.classList.add('ready');
              setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 450);
            }, wait);
          };
          // Safety net: once the intro has played, leave even if the app never signals ready
          // (the pre-rendered shell is already behind it).
          setTimeout(function() {
            if (window.dismissSplashScreen) window.dismissSplashScreen();
          }, 2800);
        </script>
      </div>
