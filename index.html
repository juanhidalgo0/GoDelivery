<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <script>
    (function() {
      try {
        var userStr = localStorage.getItem('gd-user') || localStorage.getItem('gd_user');
        var parsedRole = '';
        if (userStr) {
          try {
            var u = JSON.parse(userStr);
            if (u) parsedRole = u.role || (u.isDelivery ? 'delivery' : '');
          } catch(e) {}
        }
        var isDriverCached = localStorage.getItem('gd_is_delivery') === 'true' || 
                             localStorage.getItem('gd_user_role') === 'delivery' || 
                             localStorage.getItem('gd_user_role') === 'chofer' ||
                             parsedRole === 'delivery' || 
                             parsedRole === 'chofer';
        var isTempClient = sessionStorage.getItem('gd_temp_client_mode') === 'true';
        if (isDriverCached && !isTempClient) {
          document.documentElement.classList.add('is-delivery-mode');
          document.documentElement.setAttribute('data-theme', 'dark');
          if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#' || window.location.hash === '') {
            window.location.hash = '#/delivery';
          }
        }
      } catch(e) {}
    })();
  </script>
  <style>
    html.is-delivery-mode .slide-panel:not(#page-delivery),
    html.is-delivery-mode #page-home,
    html.is-delivery-mode #app-header,

    html.is-delivery-mode,

      background: #020617 !important;

    }
    html.is-delivery-mode #page-delivery,
    body.is-delivery-mode #page-delivery {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      background: #020617 !important;
    }
  </style>
  <script>
    window.addEventListener('error', function(e) {
      var msg = (e && e.message) ? e.message : '';
      if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('MIME type') !== -1) {
        if (!sessionStorage.getItem('gd_chunk_reload')) {
          sessionStorage.setItem('gd_chunk_reload', 'true');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          window.location.reload(true);
        }
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e && e.reason;
      var msg = (reason && reason.message) ? reason.message : String(reason || '');
      if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('MIME type') !== -1) {
        if (!sessionStorage.getItem('gd_chunk_reload')) {
          sessionStorage.setItem('gd_chunk_reload', 'true');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          window.location.reload(true);
        }
      }
    });

    if (window.location.hash.includes('/seguimiento/wa/')) {
      const match = window.location.hash.match(/#\/seguimiento\/wa\/([^?]+)/);
      if (match && match[1]) {
        window.location.href = '/seguimiento.html?id=' + match[1];
      }
    }
    (function() {
      var isNative = !!(window.Capacitor?.isNativePlatform ? window.Capacitor.isNativePlatform() : (window.Capacitor && window.Capacitor.isNative));
      if (!isNative && 'fetch' in window) {
        fetch('/version.json?cb=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d && d.version) {
              var v = String(d.version);
              var cur = localStorage.getItem('gd_app_version');
              var logoutDone = localStorage.getItem('gd_force_logout_v1.6') === 'true';
              if (cur && cur !== v) {
                localStorage.setItem('gd_app_version', v);

                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                  });
                }
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(n) { caches.delete(n); });
                  });
                }
                setTimeout(function() { window.location.reload(true); }, 200);
              } else {
                localStorage.setItem('gd_app_version', v);
              }
            }
          }).catch(function() {});
      }
    })();
  </script>

  <!-- Critical CSS for Splash Screen (Instant Paint) -->
  <style>
    :root {
      --color-primary: #E11D48;
      --color-secondary: #1A1A1A;
      --color-bg: #FFFFFF;
      --font-display: 'Outfit', sans-serif;
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .skeleton {
      position: relative !important;
      overflow: hidden !important;
    }

    .skeleton::after {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      transform: translateX(-100%) !important;
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 20%,
        rgba(255, 255, 255, 0.6) 60%,
        rgba(255, 255, 255, 0) 100%
      ) !important;
      animation: shimmerSweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
      content: '' !important;
    }

    body {
      margin: 0;
      background: var(--color-bg);
    }

    /* Premium Cinematic Blend Background - Starts Red */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #E11D48;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    #app.ready #splash-screen {
      background: transparent !important;
    }

    /* Expanding Morphing White Sphere from Logo Center */
    .splash-circle-grow {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #FFFFFF;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #app.ready .splash-circle-grow {
      animation: expandWhiteCircle 1.6s cubic-bezier(0.85, 0, 0.15, 1) forwards;
    }

    @keyframes expandWhiteCircle {
      0% {
        transform: translate(-50%, -50%) scale(0);
      }
      100% {
        transform: translate(-50%, -50%) scale(350);
      }
    }

    /* Collapsing Red Sphere from Outside In */
    .splash-circle-red-collapse {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #E11D48;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center;
      z-index: 2;
      pointer-events: none;
    }

    #app.ready .splash-circle-red-collapse {
      animation: collapseRedCircle 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes collapseRedCircle {
      0% {
        transform: translate(-50%, -50%) scale(350);
      }
      100% {
        transform: translate(-50%, -50%) scale(0);
      }
    }

    #splash-screen.fade-out,
    #app.ready #splash-screen {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #app.ready #splash-progress-container {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Expanding Ripple Shockwaves */
    .splash-ripple {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      animation: rippleOut 1.8s cubic-bezier(0.85, 0, 0.15, 1) forwards;
    }

    .splash-ripple.ripple-white {
      border: 2px solid rgba(255, 255, 255, 0.75);
    }

    .splash-ripple.ripple-red {
      border: 2px solid rgba(225, 29, 72, 0.45);
    }

    @keyframes rippleOut {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(4.5);
        opacity: 0;
      }
    }

    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 1.0s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.0s ease;
      will-change: transform, opacity;
    }

    #app.ready .splash-logo-container {
      animation: logoExit 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    #app.ready .splash-loader-container {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    @keyframes logoExit {
      0% {
        transform: scale(1);
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        transform: scale(1.15);
        opacity: 0;
        filter: blur(8px);
      }
    }

    /* Logo Container - Minimalist & Breathing with red/pink shadow */
    .splash-logo-container {
      position: relative;
      width: 195px;
      height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 15px 35px rgba(225, 29, 72, 0.25));
      animation: logoEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, logoFloat 3s ease-in-out infinite 0.8s;
    }

    .splash-logo-container::before {
      content: '';
      position: absolute;
      width: 185px;
      height: 185px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #E11D48, #FF6B81, #FF4757, #E11D48);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateBorder 3s linear infinite;
      z-index: 1;
    }

    .splash-logo-img {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 2;
      animation: logoWobble 6s ease-in-out infinite 0.8s;
    }

    @keyframes logoEntrance {
      0% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes rotateBorder {
      100% { transform: rotate(360deg); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes logoWobble {
      0%, 100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
      33% { border-radius: 54% 46% 52% 48% / 48% 52% 46% 54%; }
      66% { border-radius: 46% 54% 48% 52% / 52% 48% 54% 46%; }
    }

    /* Spinner & Progress - Brand Red Spinner on White */
    .splash-loader-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      animation: fadeIn 0.8s ease 0.3s both;
    }

    .splash-spinner {
      width: 40px;
      height: 40px;
      animation: rotateSpinner 2s linear infinite;
    }

    .splash-spinner .path-bg {
      stroke: #FFE4E6;
    }

    .splash-spinner .path {
      stroke: #E11D48;
      stroke-linecap: round;
      animation: dashSpinner 1.5s ease-in-out infinite;
    }

    @keyframes rotateSpinner {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dashSpinner {
      0% {
        stroke-dasharray: 1, 150;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -35;
      }
      100% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -124;
      }
    }

    /* Dynamic Loading Text - Premium brand red contrast */
    .loading-text-wrapper {
      position: relative;
      height: 20px;
      width: 280px;
      text-align: center;
      overflow: hidden;
    }

    .loading-text {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0 auto;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: #E11D48;
      opacity: 0;
      transform: translateY(12px);
    }

    .loading-text.text-1 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loading-text.text-2 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 2s;
    }

    .loading-text.text-3 {
      animation: sequenceText 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 4s;
    }

    @keyframes sequenceText {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      5%, 28% {
        opacity: 1;
        transform: translateY(0);
      }
      33%, 100% {
        opacity: 0;
        transform: translateY(-12px);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Smooth App Shell Entry Animation without Layout Shifts */
    #app-header {
      opacity: 0;
      transition: opacity 0.35s ease-out;
      will-change: opacity;
    }

    #app-slider, #app-navbar {
      opacity: 0;
      transform: translateY(12px);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    #app.ready #app-header {
      opacity: 1;
    }

    #app.ready #app-slider {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.08s;
    }

    #app.ready #app-navbar {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.16s;
    }
  </style>

  <style>
    /* Safety fallback for iOS: Ensure splash screen ALWAYS disappears within 2.5s max */
  </style>
  <script>
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.dataset.dismissed) {
        splash.dataset.dismissed = 'true';
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    }, 2500);
  </script>

              s.classList.add('fade-out');
